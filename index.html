<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NUMÉA — Calculator</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="calculator-page">


        <section class="calculator">


            <!-- HEADER -->

            <div class="calculator-header">

                <span class="calculator-label">
                    NUMÉA
                </span>


                <div class="header-actions">

                    <!-- HISTORY -->

                    <button
                        class="history-toggle"
                        id="historyToggle"
                        aria-label="Open calculation history"
                    >
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </button>


                    <!-- THEME -->

                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        aria-label="Toggle theme"
                    >
                        <i class="fa-solid fa-moon"></i>
                    </button>

                </div>

            </div>



            <!-- BASIC / SCIENTIFIC MODE -->

            <div class="mode-switch">

                <button
                    class="mode-button active"
                    id="basicMode"
                    data-mode="basic"
                >
                    Basic
                </button>


                <button
                    class="mode-button"
                    id="scientificMode"
                    data-mode="scientific"
                >
                    Scientific
                </button>

            </div>



            <!-- HISTORY PANEL -->

            <div
                class="history-panel"
                id="historyPanel"
            >

                <div class="history-header">

                    <span>
                        History
                    </span>


                    <button
                        class="clear-history"
                        id="clearHistory"
                    >
                        Clear
                    </button>

                </div>


                <div
                    class="history-list"
                    id="historyList"
                >

                    <p class="empty-history">
                        No calculations yet.
                    </p>

                </div>

            </div>



            <!-- DISPLAY -->

            <div class="display">

                <div
                    class="previous-value"
                    id="previousValue"
                ></div>


                <div
                    class="current-value"
                    id="currentValue"
                >
                    0
                </div>

            </div>



            <!-- SCIENTIFIC BUTTONS -->

            <div
                class="scientific-buttons"
                id="scientificButtons"
            >

                <button
                    class="button function"
                    data-action="sqrt"
                >
                    √
                </button>


                <button
                    class="button function"
                    data-action="square"
                >
                    x²
                </button>


                <button
                    class="button function"
                    data-action="reciprocal"
                >
                    1/x
                </button>


                <button
                    class="button function"
                    data-action="pi"
                >
                    π
                </button>


                <button
                    class="button function"
                    data-action="sin"
                >
                    sin
                </button>


                <button
                    class="button function"
                    data-action="cos"
                >
                    cos
                </button>


                <button
                    class="button function"
                    data-action="tan"
                >
                    tan
                </button>


                <button
                    class="button function"
                    data-action="log"
                >
                    log
                </button>


                <button
                    class="button function"
                    data-action="negative"
                >
                    ±
                </button>


                <button
                    class="button function"
                    data-action="percent"
                >
                    %
                </button>

            </div>



            <!-- MAIN CALCULATOR BUTTONS -->

            <div class="calculator-buttons">


                <!-- FIRST ROW -->

                <button
                    class="button function"
                    data-action="clear"
                >
                    AC
                </button>


                <button
                    class="button function"
                    data-action="delete"
                >
                    DEL
                </button>


                <button
                    class="button function"
                    data-action="parentheses"
                >
                    ( )
                </button>


                <button
                    class="button operator"
                    data-operator="÷"
                >
                    ÷
                </button>



                <!-- SECOND ROW -->

                <button
                    class="button number"
                    data-number="7"
                >
                    7
                </button>


                <button
                    class="button number"
                    data-number="8"
                >
                    8
                </button>


                <button
                    class="button number"
                    data-number="9"
                >
                    9
                </button>


                <button
                    class="button operator"
                    data-operator="×"
                >
                    ×
                </button>



                <!-- THIRD ROW -->

                <button
                    class="button number"
                    data-number="4"
                >
                    4
                </button>


                <button
                    class="button number"
                    data-number="5"
                >
                    5
                </button>


                <button
                    class="button number"
                    data-number="6"
                >
                    6
                </button>


                <button
                    class="button operator"
                    data-operator="-"
                >
                    −
                </button>



                <!-- FOURTH ROW -->

                <button
                    class="button number"
                    data-number="1"
                >
                    1
                </button>


                <button
                    class="button number"
                    data-number="2"
                >
                    2
                </button>


                <button
                    class="button number"
                    data-number="3"
                >
                    3
                </button>


                <button
                    class="button operator"
                    data-operator="+"
                >
                    +
                </button>



                <!-- FIFTH ROW -->

                <button
                    class="button number zero"
                    data-number="0"
                >
                    0
                </button>


                <button
                    class="button number"
                    data-number="."
                >
                    .
                </button>


                <button
                    class="button equals"
                    data-action="calculate"
                >
                    =
                </button>

            </div>


        </section>



        <!-- FOOTER -->

        <p class="page-note">
            Calculate anything. Think beyond numbers.
        </p>


    </main>



    <!-- JavaScript -->

    <script src="script.js" defer></script>


</body>

</html>
